services:
  _defaults:
    autoconfigure: true
    autowire: true
    public: false

  Drupal\pnx_ds_common\Components\PnxDsCommonComponentsRegistry:
    decorates: components.registry
    parent: components.registry

  Drupal\pnx_ds_common\Theme\ThemeRegistry:
    decorates: 'theme.registry'
    parent: 'theme.registry'
    calls:
      - [setPintoHookTheme, ['%pinto.internal.hook_theme%']]

  Drupal\pnx_ds_common\Menu\MenuToMenuTree: ~

  # Canvas integration
  # Conditionally removed in PnxDsCommonCompilerPass.
  Drupal\pnx_ds_common\PintoCanvasRender\ElementSlots:
    public: true
  Drupal\pnx_ds_common\PintoCanvasRender\IdsCustomBehaviourResolver:
    public: true # shouldnt be necessary / core bug
  Drupal\pnx_ds_common\PintoCanvasRender\IdsGenericResolver:
    public: true # shouldnt be necessary / core bug
  Drupal\pnx_ds_common\PintoCanvasRender\IdsAccordionItemMutator:
    public: true # shouldnt be necessary / core bug
